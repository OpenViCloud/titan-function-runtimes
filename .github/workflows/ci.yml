name: CI

# The Docker actions run with packages: write in the push job, so they are pinned by commit (the comment names the release);
# the first-party actions/* are pinned by major tag.
# Tests of the three adapters and of the Go library, the contract suite that runs every adapter through the same cases,
# and the three runtime images: built on every run, pushed to GHCR only from main once the tests passed, tagged with the
# full commit sha. One manifest per image (no provenance index): the function cluster composes images from it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # titan-ops is private, so a link into it is a 404 for every reader of this repository; a titan-ops doc is named
      # `titan-ops <path under its docs/>#<anchor>` instead.
      - name: No URL into private titan-ops
        run: |
          if git grep -n -I -i -E 'github(usercontent)?\.com[:/](repos/)?openvicloud/titan-ops([^[:alnum:]_-]|$)' -- ':/'; then
            echo "URL into private titan-ops above: write titan-ops <path>#<anchor>"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Guard of the images and this workflow
        run: python3 scripts/test_images.py

      - name: Python adapter
        run: python3 python/test_adapter.py

      - name: Node.js adapter
        run: node --test node/adapter.test.mjs

      - name: Go library
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./function/ -count=1

      - name: Contract of every runtime
        run: python3 tests/contract/contract_test.py

  image:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: python
            name: python3.15
          - dir: node
            name: nodejs26
          - dir: go
            name: go
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.dir }}
          platforms: linux/amd64
          provenance: false
          push: false

  push:
    name: Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: python
            name: python3.15
          - dir: node
            name: nodejs26
          - dir: go
            name: go
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.dir }}
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ghcr.io/openvicloud/titan-function-runtimes/${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Digest
        run: echo "ghcr.io/openvicloud/titan-function-runtimes/${{ matrix.name }}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
